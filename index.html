<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --admin: #f59e0b;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1rem;
    }

    .role-pill {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .role-pill.is-admin {
      background: rgba(245, 158, 11, 0.16);
      color: var(--admin);
      border-color: rgba(245, 158, 11, 0.5);
    }

    .key-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      outline: none;
      font-size: 0.86rem;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    #api-key-input {
      flex: 1;
      min-width: 150px;
    }

    button, summary.admin-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      touch-action: manipulation;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    button:active, summary.admin-btn:active {
      transform: scale(0.98);
    }

    .btn-save {
      background: var(--accent);
      color: #061322;
    }

    .btn-clear-chat {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .admin-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .admin-btn.active {
      background: var(--admin);
      color: #1f1300;
      border-color: var(--admin);
    }

    details#admin-box {
      position: relative;
    }

    .admin-popover {
      margin-top: 8px;
      background: var(--bg);
      border: 1px solid rgba(245, 158, 11, 0.55);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #admin-pass-input {
      flex: 1;
      padding: 7px 10px;
    }

    .btn-ok {
      background: var(--admin);
      color: #1f1300;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 86%;
      padding: 11px 14px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.94rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    .msg.system {
      align-self: center;
      background: rgba(56, 189, 248, 0.08);
      color: var(--accent);
      border: 1px dashed rgba(56, 189, 248, 0.45);
      font-size: 0.82rem;
      max-width: 94%;
    }

    .msg img.attached-img {
      max-width: 230px;
      max-height: 230px;
      border-radius: 8px;
      display: block;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    pre {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      padding-top: 34px;
      overflow-x: auto;
      position: relative;
      margin: 8px 0;
    }

    code {
      font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      font-size: 0.85rem;
      color: #e2e8f0;
    }

    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 4px 9px;
      font-size: 0.72rem;
      border-radius: 5px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    #preview-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #preview-bar.show {
      display: flex;
    }

    #preview-img {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--accent);
    }

    .btn-remove-img {
      background: var(--danger);
      color: #fff;
      padding: 5px 9px;
      font-size: 0.75rem;
    }

    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-photo {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 1rem;
    }

    .btn-photo:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #prompt-input {
      flex: 1;
      padding: 11px 12px;
      font-size: 0.94rem;
    }

    #prompt-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #send-btn {
      background: var(--success);
      color: #052e16;
      padding: 11px 16px;
      font-size: 0.94rem;
    }

    #send-btn:disabled {
      background: var(--card);
      color: var(--muted);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="title-group">
        <span>AI Studio</span>
        <span id="role-badge" class="role-pill">Khách</span>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <select id="model-select" title="Chọn Model">
          <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash</option>
          <option value="gpt-free">GPT-4o Mini Free</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        </select>
        <button type="button" id="clear-chat-btn" class="btn-clear-chat" title="Xóa lịch sử chat">Xóa</button>
      </div>
    </div>

    <div class="key-row">
      <input type="text" id="api-key-input" placeholder="Nhập API Key..." autocomplete="off" />
      <button type="button" id="save-key-btn" class="btn-save">Lưu Key</button>
      <details id="admin-box">
        <summary id="admin-summary" class="admin-btn">Admin</summary>
        <div class="admin-popover">
          <input type="password" id="admin-pass-input" placeholder="Mã Admin (ADMIN_VIP_2026)" />
          <button type="button" id="confirm-admin-btn" class="btn-ok">Xác nhận</button>
        </div>
      </details>
    </div>
  </header>

  <div id="chat-box">
    <div class="msg system">
      Nhập API Key và bấm <b>Lưu Key</b> để mở khóa.
    </div>
  </div>

  <div id="preview-bar">
    <img id="preview-img" src="" alt="Preview" />
    <span style="flex:1; font-size:0.82rem; color:var(--muted);">Ảnh đã sẵn sàng gửi</span>
    <button type="button" id="remove-img-btn" class="btn-remove-img">Bỏ ảnh</button>
  </div>

  <footer>
    <input type="file" id="image-input" accept="image/*" style="display:none;" />
    <button type="button" id="photo-btn" class="btn-photo" disabled title="Gửi ảnh">📷</button>
    <input type="text" id="prompt-input" placeholder="Nhập API Key trước..." disabled />
    <button type="button" id="send-btn" disabled>Gửi</button>
  </footer>

  <script>
    (function () {
      const ADMIN_SECRET = "ADMIN_VIP_2026";
      const STORAGE_KEY = "ai_studio_key_v1";
      const STORAGE_ADMIN = "ai_studio_admin_v1";

      let apiKey = "";
      let isAdmin = false;
      let chatHistory = [];
      let imageBase64 = null;
      let imageMime = null;

      const apiKeyInput = document.getElementById("api-key-input");
      const saveKeyBtn = document.getElementById("save-key-btn");
      const clearChatBtn = document.getElementById("clear-chat-btn");
      const adminBox = document.getElementById("admin-box");
      const adminSummary = document.getElementById("admin-summary");
      const adminPassInput = document.getElementById("admin-pass-input");
      const confirmAdminBtn = document.getElementById("confirm-admin-btn");
      const roleBadge = document.getElementById("role-badge");
      const modelSelect = document.getElementById("model-select");

      const chatBox = document.getElementById("chat-box");
      const promptInput = document.getElementById("prompt-input");
      const sendBtn = document.getElementById("send-btn");
      const photoBtn = document.getElementById("photo-btn");
      const imageInput = document.getElementById("image-input");
      const previewBar = document.getElementById("preview-bar");
      const previewImg = document.getElementById("preview-img");
      const removeImgBtn = document.getElementById("remove-img-btn");

      function addSystemMsg(html) {
        const div = document.createElement("div");
        div.className = "msg system";
        div.innerHTML = html;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function unlockChat(key) {
        apiKey = key;
        promptInput.disabled = false;
        sendBtn.disabled = false;
        photoBtn.disabled = false;
        promptInput.placeholder = "Nhập câu hỏi, yêu cầu code hoặc gửi ảnh...";
      }

      function applyAdminState(state) {
        isAdmin = state;
        if (isAdmin) {
          roleBadge.textContent = "ADMIN";
          roleBadge.classList.add("is-admin");
          adminSummary.textContent = "Admin: Bật";
          adminSummary.classList.add("active");
        } else {
          roleBadge.textContent = "Khách";
          roleBadge.classList.remove("is-admin");
          adminSummary.textContent = "Admin";
          adminSummary.classList.remove("active");
        }
      }

      // Khôi phục Key & Admin nếu đã lưu trước đó
      try {
        const savedKey = localStorage.getItem(STORAGE_KEY);
        if (savedKey) {
          apiKeyInput.value = savedKey;
          unlockChat(savedKey);
          addSystemMsg("Đã tự động tải API Key đã lưu.");
        }
        if (localStorage.getItem(STORAGE_ADMIN) === "1") {
          applyAdminState(true);
        }
      } catch (_) {}

      function handleSaveKey() {
        const val = (apiKeyInput.value || "").trim();
        if (!val) {
          addSystemMsg("Vui lòng nhập API Key trước.");
          apiKeyInput.focus();
          return;
        }
        try { localStorage.setItem(STORAGE_KEY, val); } catch (_) {}
        unlockChat(val);
        addSystemMsg("Đã lưu API Key. Có thể bắt đầu chat.");
      }

      saveKeyBtn.addEventListener("click", handleSaveKey);
      apiKeyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleSaveKey();
      });

      adminSummary.addEventListener("click", (e) => {
        if (isAdmin) {
          e.preventDefault();
          applyAdminState(false);
          try { localStorage.removeItem(STORAGE_ADMIN); } catch (_) {}
          adminBox.open = false;
          addSystemMsg("Đã tắt quyền Admin.");
        }
      });

      confirmAdminBtn.addEventListener("click", () => {
        const pass = (adminPassInput.value || "").trim();
        if (pass === ADMIN_SECRET) {
          applyAdminState(true);
          try { localStorage.setItem(STORAGE_ADMIN, "1"); } catch (_) {}
          adminBox.open = false;
          adminPassInput.value = "";
          addSystemMsg("Xác nhận Admin thành công. Đã mở khóa tạo script executor Roblox.");
        } else {
          addSystemMsg("Sai mã Admin.");
        }
      });

      clearChatBtn.addEventListener("click", () => {
        chatHistory = [];
        chatBox.innerHTML = "";
        addSystemMsg(apiKey ? "Đã xóa lịch sử chat. Sẵn sàng tiếp tục." : "Đã xóa chat. Nhập API Key và bấm Lưu Key để mở khóa.");
      });

      photoBtn.addEventListener("click", () => {
        if (!apiKey) return;
        imageInput.click();
      });

      imageInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          imageMime = file.type || "image/jpeg";
          imageBase64 = String(reader.result).split(",")[1];
          previewImg.src = reader.result;
          previewBar.classList.add("show");
        };
        reader.readAsDataURL(file);
      });

      function clearImage() {
        imageBase64 = null;
        imageMime = null;
        imageInput.value = "";
        previewBar.classList.remove("show");
      }

      removeImgBtn.addEventListener("click", clearImage);

      function getSystemPrompt() {
        if (isAdmin) {
          return [
            "Bạn là trợ lý lập trình chuyên sâu và chuyên gia LuaU cho Roblox.",
            "Người dùng hiện tại ĐÃ ĐƯỢC XÁC MINH LÀ ADMIN.",
            "- Hỗ trợ viết code mọi ngôn ngữ (HTML/CSS/JS, Python, C++, Lua...) và phân tích hình ảnh.",
            "- Khi người dùng yêu cầu tạo script cho Roblox Executor (Delta, Fluxus, Codex...), hãy hỗ trợ đầy đủ, viết code Lua sạch, tối ưu, rõ ràng theo yêu cầu."
          ].join("\n");
        }
        return [
          "Bạn là trợ lý lập trình chuyên nghiệp.",
          "- Hỗ trợ viết code lập trình thông thường và phân tích hình ảnh.",
          "- QUY TẮC BẮT BUỘC: Người dùng hiện tại CHƯA xác minh quyền Admin. Nếu họ yêu cầu viết script cho Roblox Executor (Delta, Fluxus, exploit script, loadstring menu...), bạn PHẢI TỪ CHỐI rõ ràng và yêu cầu họ xác nhận Admin ở thanh phía trên trước."
        ].join("\n");
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function callGemini(modelName) {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: getSystemPrompt() }] },
            contents: chatHistory
          })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error((data.error && data.error.message) || `Gemini lỗi HTTP ${res.status}`);
        }
        return (
          data.candidates &&
          data.candidates[0] &&
          data.candidates[0].content &&
          data.candidates[0].content.parts &&
          data.candidates[0].content.parts[0] &&
          data.candidates[0].content.parts[0].text
        ) || "Không có phản hồi.";
      }

      async function callGPTFree() {
        const messages = [{ role: "system", content: getSystemPrompt() }];
        for (const turn of chatHistory) {
          const role = turn.role === "model" ? "assistant" : "user";
          const content = [];
          for (const part of turn.parts) {
            if (part.text) content.push({ type: "text", text: part.text });
            if (part.inline_data) {
              content.push({
                type: "image_url",
                image_url: { url: `data:${part.inline_data.mime_type};base64,${part.inline_data.data}` }
              });
            }
          }
          messages.push({ role, content });
        }

        const res = await fetch("https://text.pollinations.ai/openai", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: "openai", messages })
        });
        if (!res.ok) {
          throw new Error(`GPT Free lỗi HTTP ${res.status}`);
        }
        const data = await res.json();
        return (
          data.choices &&
          data.choices[0] &&
          data.choices[0].message &&
          data.choices[0].message.content
        ) || "Không có phản hồi.";
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function formatReply(text) {
        let html = escapeHtml(text);
        html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, _lang, code) => {
          return `<pre><button type="button" class="copy-btn" data-copy="1">Copy</button><code>${code.trim()}</code></pre>`;
        });
        html = html.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
        return html;
      }

      chatBox.addEventListener("click", (e) => {
        if (e.target && e.target.getAttribute("data-copy") === "1") {
          const pre = e.target.parentElement;
          const codeEl = pre ? pre.querySelector("code") : null;
          const raw = codeEl ? codeEl.innerText : "";
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(raw).catch(() => {});
          }
          e.target.textContent = "Đã copy";
          setTimeout(() => { e.target.textContent = "Copy"; }, 1400);
        }
      });

      function appendChatMsg(sender, text, imgUrl) {
        const div = document.createElement("div");
        div.className = "msg " + sender;
        let out = "";
        if (imgUrl) {
          out += `<img class="attached-img" src="${imgUrl}" alt="img" />`;
        }
        out += sender === "ai" ? formatReply(text) : escapeHtml(text);
        div.innerHTML = out;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
      }

      async function sendMessage() {
        if (!apiKey) return;
        const text = (promptInput.value || "").trim();
        if (!text && !imageBase64) return;

        const cleanText = text || "Phân tích ảnh này giúp tôi.";
        const imgSrc = imageBase64 ? `data:${imageMime};base64,${imageBase64}` : null;
        appendChatMsg("user", cleanText, imgSrc);

        const prefix = isAdmin ? "[TRẠNG THÁI: ADMIN] " : "[TRẠNG THÁI: KHÁCH] ";
        const parts = [{ text: prefix + cleanText }];
        if (imageBase64) {
          parts.push({ inline_data: { mime_type: imageMime, data: imageBase64 } });
        }
        chatHistory.push({ role: "user", parts });

        promptInput.value = "";
        clearImage();
        promptInput.disabled = true;
        sendBtn.disabled = true;
        photoBtn.disabled = true;

        const chosen = modelSelect.value;
        const aiBubble = appendChatMsg("ai", "Đang xử lý...");

        let ok = false;
        let errMsg = "";

        try {
          if (chosen === "gpt-free") {
            const reply = await callGPTFree();
            chatHistory.push({ role: "model", parts: [{ text: reply }] });
            aiBubble.innerHTML = formatReply(reply);
            ok = true;
          } else {
            const list = chosen === "gemini-3.8-flash"
              ? [
